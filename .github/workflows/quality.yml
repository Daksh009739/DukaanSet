name: Quality
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DUKAANSET_ENV: local
      AUTH_EMAIL_MODE: file
      AI_PROVIDER: ''
      DUKAANSET_MEDIA_WORKER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:locales
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Require real desktop and Android VoiceOS acceptance before main promotion
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node scripts/qa/voice33-release-gate.mjs
      - name: Labelled V15 semantic intent, entity roles and financial slot regression gate
        run: npm run test:voice-eval
      - name: VoiceOS 3 automatic language and explicit confirmation regression gate
        run: node --import tsx scripts/qa/voice3-evaluation.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Approved dashboard, product media and shared mobile design checks
        run: npm run test:e2e -- tests/e2e/approved-dashboard.spec.ts
      - name: V16.1 approved composition, cash accuracy, weather fallback and multilingual viewport checks
        run: npm run test:e2e -- tests/e2e/approved-dashboard-v16.spec.ts
      - name: Dashboard card colors, styled native pickers, hover feedback and exact session information
        run: npm run test:e2e -- tests/e2e/dashboard-polish.spec.ts
      - name: Compiled dashboard card palette, exact totals and multilingual accessibility
        run: node scripts/qa/dashboard-cards-production.mjs
      - name: Premium module filters, signed refund summaries and multilingual responsive accessibility
        run: npm run test:e2e -- tests/e2e/premium-modules.spec.ts
      - name: Premium insight pages, task filtering, account navigation and acknowledged closing
        run: npm run test:e2e -- tests/e2e/insight-workspaces.spec.ts
      - name: Compiled insight workspaces, account focus and multilingual accessibility
        run: node scripts/qa/insight-workspaces-production.mjs
      - name: Workspace search, update actions, hero controls and multilingual dialog accessibility
        run: npm run test:e2e -- tests/e2e/workspace-overlays.spec.ts
      - name: Premium application header controls, responsive fit and accessible contrast
        run: npm run test:e2e -- tests/e2e/application-header.spec.ts
      - name: Compiled application header and three-language viewport checks
        run: node scripts/qa/application-header-production.mjs
      - name: Compiled workspace overlays and responsive dashboard controls
        run: node scripts/qa/workspace-overlays-production.mjs
      - name: Smart sidebar, persisted rail, protected shop switching and multilingual accessible drawers
        run: npm run test:e2e -- tests/e2e/smart-sidebar.spec.ts
      - name: Critical auth, isolation, inventory and sales browser checks
        run: npm run test:e2e -- tests/e2e/product.spec.ts
      - name: Customer details, mobile sale recovery, voice stock and DemandPulse regression checks
        run: |
          npm run test:e2e -- tests/e2e/v2-business.spec.ts
          npm run test:e2e -- tests/e2e/v2-sales.spec.ts
          npm run test:e2e -- tests/e2e/v2-voice.spec.ts
          npm run test:e2e -- tests/e2e/v3-demand.spec.ts
      - name: VoiceOS financial and microphone browser checks
        run: npm run test:e2e -- tests/e2e/voiceos.spec.ts
      - name: Conversational VoiceOS, automatic product drafting and atomic stock checks
        run: npm run test:e2e -- tests/e2e/conversation.spec.ts
      - name: V14 cross-module commands, shared assistant, DemandPulse preparation and responsive accessibility
        run: npm run test:e2e -- tests/e2e/premium-voice-v14.spec.ts
      - name: V15 semantic billing, conditional simulations, reorder retries and purchase extraction
        run: npm run test:e2e -- tests/e2e/voice-v15.spec.ts
      - name: V17 conversation memory, actual transactions, speech finals, frozen retries and multilingual accessibility
        run: npm run test:e2e -- tests/e2e/voice-v17.spec.ts
      - name: VoiceOS 3 turn taking, spoken commits, encoded audio, preferences and multilingual accessibility
        run: npm run test:e2e -- tests/e2e/voice3.spec.ts
      - name: VoiceOS 3.1 automatic endpoints, exact customer commits, language precedence and stale response isolation
        run: npm run test:e2e -- tests/e2e/voice31.spec.ts
      - name: VoiceOS 3.3 default hands-free, separate same-name customers, pause latch and verified spoken confirmation
        run: npm run test:e2e -- tests/e2e/voice33.spec.ts
      - name: VoiceOS 3 compiled actions, audio playback and responsive voice selection
        run: node scripts/qa/voice3-production-review.mjs
      - name: V17 compiled transactions, actual closing/document sources and multilingual accessibility
        run: node scripts/qa/v17-production-review.mjs
      - name: Contextual VoiceOS heroes, safe prefill, scoped records and multilingual responsive controls
        run: npm run test:e2e -- tests/e2e/voice-hero.spec.ts
      - name: New product stock, lost acknowledgements and mobile inventory checks
        run: npm run test:e2e -- tests/e2e/voice-products.spec.ts
      - name: Dashboard, closing concurrency, report versions and translated PDF checks
        run: npm run test:e2e -- tests/e2e/closing-dashboard.spec.ts

      - name: Multilingual drafts, PDFs, SEO and responsive browser checks
        run: npm run test:e2e -- tests/e2e/localization.spec.ts
      - name: Invoice Studio, Customer Hisaab and WhatsApp confirmation browser checks
        run: npm run test:e2e -- tests/e2e/invoice-studio.spec.ts
      - name: Premium website, multilingual auth and product demonstration browser checks
        run: npm run test:e2e -- tests/e2e/premium-website.spec.ts

      - name: Compiled dashboard, closing PDFs and durable backend timer checks
        run: node scripts/qa/v10-production-review.mjs
      - name: Compiled conversational billing and shared stock automation checks
        run: node scripts/qa/v12-production-review.mjs

      - name: Compiled approved dashboard, VoiceOS, real media queue and invoice demonstration
        run: node scripts/qa/v13-production-review.mjs

      - name: Compiled V14 cross-module saves, shared Assistant and premium screens
        run: node scripts/qa/v14-production-review.mjs
      - name: Compiled V15 semantic billing and authoritative business intelligence
        run: node scripts/qa/v15-production-review.mjs

      - name: Compiled V15.2 contextual heroes, record references and responsive accessibility
        run: node scripts/qa/v15-2-production-review.mjs
      - name: Compiled V16.1 reference layout, real cash totals and thirty accessible dashboard layouts
        run: node scripts/qa/v16-production-review.mjs
      - name: Compiled V16.2 expanded sidebar, icon rail, shop switcher and multilingual mobile drawers
        run: node scripts/qa/sidebar-production-review.mjs
