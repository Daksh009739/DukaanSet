name: Quality
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DUKAANSET_ENV: local
      AUTH_EMAIL_MODE: file
      AI_PROVIDER: ''
      DUKAANSET_MEDIA_WORKER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:locales
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Approved dashboard, product media and shared mobile design checks
        run: npm run test:e2e -- tests/e2e/approved-dashboard.spec.ts
      - name: Critical auth, isolation, inventory and sales browser checks
        run: npm run test:e2e -- tests/e2e/product.spec.ts
      - name: Customer details, mobile sale recovery, voice stock and DemandPulse regression checks
        run: |
          npm run test:e2e -- tests/e2e/v2-business.spec.ts
          npm run test:e2e -- tests/e2e/v2-sales.spec.ts
          npm run test:e2e -- tests/e2e/v2-voice.spec.ts
          npm run test:e2e -- tests/e2e/v3-demand.spec.ts
      - name: VoiceOS financial and microphone browser checks
        run: npm run test:e2e -- tests/e2e/voiceos.spec.ts
      - name: Conversational VoiceOS, automatic product drafting and atomic stock checks
        run: npm run test:e2e -- tests/e2e/conversation.spec.ts
      - name: New product stock, lost acknowledgements and mobile inventory checks
        run: npm run test:e2e -- tests/e2e/voice-products.spec.ts
      - name: Dashboard, closing concurrency, report versions and translated PDF checks
        run: npm run test:e2e -- tests/e2e/closing-dashboard.spec.ts

      - name: Multilingual drafts, PDFs, SEO and responsive browser checks
        run: npm run test:e2e -- tests/e2e/localization.spec.ts
      - name: Invoice Studio, Customer Hisaab and WhatsApp confirmation browser checks
        run: npm run test:e2e -- tests/e2e/invoice-studio.spec.ts
      - name: Premium website, multilingual auth and product demonstration browser checks
        run: npm run test:e2e -- tests/e2e/premium-website.spec.ts

      - name: Compiled dashboard, closing PDFs and durable backend timer checks
        run: node scripts/qa/v10-production-review.mjs
      - name: Compiled conversational billing and shared stock automation checks
        run: node scripts/qa/v12-production-review.mjs

      - name: Compiled approved dashboard, VoiceOS, real media queue and invoice demonstration
        run: node scripts/qa/v13-production-review.mjs
