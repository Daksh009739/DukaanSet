name: Quality
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DUKAANSET_ENV: local
      AUTH_EMAIL_MODE: file
      AI_PROVIDER: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:locales
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Critical auth, isolation, inventory and sales browser checks
        run: npm run test:e2e -- tests/e2e/product.spec.ts
      - name: VoiceOS financial and microphone browser checks
        run: npm run test:e2e -- tests/e2e/voiceos.spec.ts

      - name: Multilingual drafts, PDFs, SEO and responsive browser checks
        run: npm run test:e2e -- tests/e2e/localization.spec.ts
      - name: Invoice Studio, Customer Hisaab and WhatsApp confirmation browser checks
        run: npm run test:e2e -- tests/e2e/invoice-studio.spec.ts
      - name: Premium website, multilingual auth and product demonstration browser checks
        run: npm run test:e2e -- tests/e2e/premium-website.spec.ts
